{% extends "base.html" %}
{% block title %}Analytics — VITALS+{% endblock %}
{% set active_page = 'analytics' %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Analytics</h1>
    <p class="page-header__subtitle">Trends and statistics computed from your logged history.</p>
  </div>
  <div class="filter-group" id="window-filter">
    <button data-window="7D" class="filter-btn">7D</button>
    <button data-window="30D" class="filter-btn">30D</button>
    <button data-window="90D" class="filter-btn">90D</button>
    <button data-window="1Y" class="filter-btn">1Y</button>
    <button data-window="All" class="filter-btn is-active">All</button>
  </div>
</div>

<div id="analytics-root">
  <div class="skeleton-card skeleton-card--tall"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
{% endblock %}
