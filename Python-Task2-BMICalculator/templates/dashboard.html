{% extends "base.html" %}
{% block title %}Overview — VITALS+{% endblock %}
{% set active_page = 'dashboard' %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-header__title">Overview</h1>
    <p class="page-header__subtitle">Welcome back, {{ username }}.</p>
  </div>
  <button class="btn-primary" id="open-checkin">+ Daily Check-in</button>
</div>

<div id="dashboard-root">
  <div class="skeleton-cards">
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>
</div>

<!-- Check-in modal -->
<div class="modal-overlay" id="checkin-modal" style="display:none;">
  <div class="modal-box modal-box--wide">
    <div class="modal-box__header">
      <h2>Daily Check-in</h2>
      <button class="modal-close" id="close-checkin" aria-label="Close">&times;</button>
    </div>
    <form id="checkin-form">
      <div class="form-grid">
        <div class="form-row">
          <label for="ci-date">Date</label>
          <input type="date" id="ci-date" name="entry_date" required>
        </div>
        <div class="form-row">
          <label for="ci-weight">Weight (kg)</label>
          <input type="number" id="ci-weight" name="weight_kg" step="0.1" min="1" max="500" required>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label for="ci-water">Water (L)</label>
          <input type="number" id="ci-water" name="water_l" step="0.1" min="0" max="15">
        </div>
        <div class="form-row">
          <label for="ci-steps">Steps</label>
          <input type="number" id="ci-steps" name="steps" min="0" max="100000">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label for="ci-sleep">Sleep (hours)</label>
          <input type="number" id="ci-sleep" name="sleep_hours" step="0.1" min="0" max="24">
        </div>
        <div class="form-row">
          <label for="ci-waist">Waist (cm) <span class="form-row__hint">optional</span></label>
          <input type="number" id="ci-waist" name="waist_cm" step="0.1" min="0" max="300">
        </div>
      </div>
      <div class="form-row">
        <label for="ci-calories">Calories <span class="form-row__hint">optional</span></label>
        <input type="number" id="ci-calories" name="calories" min="0" max="15000">
      </div>
      <div id="checkin-error" class="form-error" style="display:none;"></div>
      <button type="submit" class="btn-primary btn-primary--full">Save Check-in</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
